model:
  default: deepseek-v4-flash
  provider: opencode-go
  base_url: https://opencode.ai/zen/go/v1
  api_mode: chat_completions
providers:
  opencode-go:
    api_key_env: OPENCODE_GO_API_KEY
    base_url: https://opencode.ai/zen/go/v1
provider_priority:
  - opencode-go
fallback_providers: []
terminal:
  backend: local
  cwd: F:\personal_projects\specpt-hst-sim
  timeout: 180
  persistent_shell: true
agent:
  max_turns: 90
  gateway_timeout: 1800
  api_max_retries: 3
  tool_use_enforcement: auto
  task_completion_guidance: true
  environment_probe: true
  clarify_timeout: 600
delegation:
  model: deepseek-v4-pro
  provider: opencode-go
  base_url: https://opencode.ai/zen/go/v1
  max_iterations: 50
  child_timeout_seconds: 600
  max_concurrent_children: 1
  max_spawn_depth: 2
  orchestrator_enabled: true
skills:
  external_dirs:
    - C:\Users\clive\.config\opencode\skills
  creation_nudge_interval: 15
toolsets:
  - hermes-cli
display:
  compact: true
  streaming: true
  timestamps: false
  inline_diffs: true
  tool_progress: all
context:
  engine: compressor
memory:
  memory_enabled: true
  user_profile_enabled: false
approvals:
  mode: auto
