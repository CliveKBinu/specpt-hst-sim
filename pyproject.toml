[project]
name = "specpt-hst-sim"
version = "0.1.0"
description = "Autonomous SpecPT training on simulated HST grism data"
requires-python = ">=3.10"
dependencies = [
    "flask>=2.0",
    "gunicorn>=20.0",
    "ipykernel>=7.2.0",
    "jupyter>=1.1.1",
    "pandas>=2.3.3",
]

[project.optional-dependencies]
train = [
    "torch>=2.0",
    "wandb",
    "pyyaml",
    "scikit-learn",
    "scipy",
    "pandas",
    "numpy",
    "umap-learn>=0.5",
    "matplotlib>=3.7",
]

analyze = [
    "matplotlib>=3.7",
    "tqdm>=4.65",
    "pyarrow>=12.0",
    "h5py>=3.8",
    "jupyter>=1.0",
    "ipykernel>=6.0",
]

[project.scripts]
specpt-webhook = "daemon.webhook_server:app.run"
