[project]
name = "specpt-hst-sim"
version = "0.1.0"
description = "Autonomous SpecPT training on simulated HST grism data"
requires-python = ">=3.10"
dependencies = [
    "flask>=2.0",
    "gunicorn>=20.0",
]

[project.optional-dependencies]
train = [
    "torch>=2.0",
    "wandb",
    "pyyaml",
    "scikit-learn",
    "scipy",
    "pandas",
    "numpy",
]

[project.scripts]
specpt-webhook = "daemon.webhook_server:app.run"
